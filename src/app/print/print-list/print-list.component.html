<div>
  <div class="header" fxLayout fxLayoutAlign="start center" fxLayoutGap="5px">
    <button
      fxFlex="150px"
      fxFlex.xs="120px"
      style="height: 36px;"
      mat-raised-button
      routerLink="new"
      type="button"
      color="accent"
    >
      Add New Print
    </button>
    <div fxFlex fxLayoutGap="10px">
      <mat-form-field>
        <mat-label> Search: </mat-label
        ><input
          matInput
          type="text"
          [(ngModel)]="searchText"
          (ngModelChange)="debouncedUpdateFilter()"
          autocomplete="off"
      /></mat-form-field>

      <mat-form-field>
        <mat-label> Status</mat-label>
        <mat-select
          [(ngModel)]="filterByStatus"
          (ngModelChange)="updateFilter()"
        >
          <mat-option [value]="-1">All</mat-option>
          <mat-option [value]="printStatusTypes.Pending">Pending</mat-option>
          <mat-option [value]="printStatusTypes.Printing">Printing</mat-option>
          <mat-option [value]="printStatusTypes.Success">Success</mat-option>
          <mat-option [value]="printStatusTypes.Cancelled"
            >Cancelled</mat-option
          >
          <mat-option [value]="printStatusTypes.Failed">Failed</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <table
    mat-table
    [dataSource]="prints"
    matSort
    (matSortChange)="sortData($event)"
    [matSortDisableClear]="true"
  >
    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef>Image</th>
      <td mat-cell *matCellDef="let print">
        <div class="print-image">
          <app-print-image
            [printId]="print.id"
            [imageId]="print.defaultPrintImageId"
          ></app-print-image>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th
        mat-header-cell
        *matHeaderCellDef
        [mat-sort-header]="printSummarySortColumns.Title"
      >
        Title
      </th>
      <td mat-cell *matCellDef="let print">{{ print.title }}</td>
    </ng-container>

    <ng-container matColumnDef="printer">
      <th mat-header-cell *matHeaderCellDef>Printer</th>
      <td mat-cell *matCellDef="let print">
        {{ getPrinterLabel(print) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="start-date">
      <th
        mat-header-cell
        *matHeaderCellDef
        [mat-sort-header]="printSummarySortColumns.StartDate"
      >
        Start Date
      </th>
      <td mat-cell *matCellDef="let print">{{ print.startDate | date }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let print">{{ getStatus(print) }}</td>
    </ng-container>

    <ng-container matColumnDef="more">
      <th mat-header-cell *matHeaderCellDef></th>
      <td
        mat-cell
        *matCellDef="let print"
        (click)="$event.preventDefault(); $event.stopPropagation()"
      >
        <button mat-button class="transparent" [matMenuTriggerFor]="aboutMenu">
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #aboutMenu="matMenu">
          <!-- <button mat-menu-item>Fee</button> -->
          <a class="menu-link" mat-menu-item [routerLink]="[print.id, 'edit']"
            >Edit</a
          >
          <a class="menu-link" mat-menu-item [routerLink]="[print.id]">View</a>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [routerLink]="row.id"
    ></tr>
  </table>

  <div class="no-prints" *ngIf="totalCount === 0">
    No prints found. Add a new print or try a different search.
  </div>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="pageChange($event)"
  >
  </mat-paginator>

  <ng-adsense></ng-adsense>
</div>
