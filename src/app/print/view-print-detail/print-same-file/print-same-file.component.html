@if (sameFile(); as s) {
  <button
    mat-stroked-button
    type="button"
    class="same-file-trigger"
    [matMenuTriggerFor]="sameFileMenu"
    (menuOpened)="onOpened()"
    data-cy-same-file-trigger
  >
    <mat-icon>repeat</mat-icon>
    Printed {{ s.count }} times
  </button>

  <mat-menu
    #sameFileMenu="matMenu"
    class="same-file-menu"
    xPosition="before"
    aria-label="Other prints of this file"
  >
    <p class="menu-heading" aria-hidden="true">Other prints of this file</p>
    @for (p of s.prints; track p.id) {
      <a
        mat-menu-item
        class="same-file-item"
        [routerLink]="['/prints', p.id]"
        (click)="onSelected(p)"
        data-cy-same-file-print
      >
        <span class="item-row">
          <span class="item-text">
            <span class="item-title">{{ p.title || 'Untitled print' }}</span>
            <span class="item-date">{{
              p.startDate ?? p.createdDate | localeDate
            }}</span>
          </span>
          <app-print-status-badge [status]="p.status" />
        </span>
      </a>
    }
    @if (s.more > 0) {
      <!-- A disabled item rather than a paragraph: inside role="menu" a screen reader moves
           item to item and would skip plain text. -->
      <button mat-menu-item type="button" disabled data-cy-same-file-more>
        and {{ s.more }} more
      </button>
    }
  </mat-menu>
}
