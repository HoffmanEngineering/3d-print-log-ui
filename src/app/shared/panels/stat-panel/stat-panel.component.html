<mat-card appearance="outlined" class="container">
  <ng-container *ngIf="!invertDisplay; else invertedDisplay">
    <mat-card-title class="title">{{ title }}</mat-card-title>
    <mat-card-content>
      {{ value }}
    </mat-card-content>
  </ng-container>
</mat-card>

<ng-template #invertedDisplay>
  <mat-card-title class="title">{{ value }}</mat-card-title>
  <mat-card-content>
    {{ title }}
  </mat-card-content>
</ng-template>
