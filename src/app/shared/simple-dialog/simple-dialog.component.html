@if (title) {
  <h1 mat-dialog-title>{{ title }}</h1>
}
<div mat-dialog-content [innerHtml]="body"></div>
<mat-dialog-actions align="end">
  @if (noText !== '') {
    <button mat-button (click)="onNoClick()" [color]="noColor">
      {{ noText }}
    </button>
  }
  <button
    mat-flat-button
    [mat-dialog-close]="true"
    cdkFocusInitial
    [color]="yesColor"
  >
    {{ yesText }}
  </button>
</mat-dialog-actions>
