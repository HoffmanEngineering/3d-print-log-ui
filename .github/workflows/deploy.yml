name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write production environment file
        run: echo "${{ secrets.ENVIRONMENT_PROD_TS }}" > src/environments/environment.prod.ts

      - name: Lint
        run: npm run lint:brief

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Script unit tests (sitemap, security headers)
        run: npm run test:scripts

      - name: Strict null checks (gated directories)
        run: npm run typecheck:strict

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs
        env:
          SITEMAP_API_URL: https://api.3dprintlog.com

      - name: Verify prerendered output and sitemap index
        run: node scripts/verify-prerender.mjs

      - name: Verify shells
        run: node scripts/verify-shells.mjs

      - name: Deploy to Azure Static Web Apps (prebuilt)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/print-log-ui/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true
