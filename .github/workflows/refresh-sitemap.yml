name: Refresh Sitemap

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the latest release tag
        run: |
          # Highest semver v* tag, independent of commit ancestry or GitHub Releases.
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then echo "No v* tag found"; exit 1; fi
          echo "Refreshing sitemap for released tag: $TAG"
          git checkout "$TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write production environment file
        run: echo "${{ secrets.ENVIRONMENT_PROD_TS }}" > src/environments/environment.prod.ts

      - name: Build
        run: npm run build

      - name: Sitemap unit tests
        run: npm run test:sitemap

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs
        env:
          SITEMAP_API_URL: https://api.3dprintlog.com

      - name: Verify prerendered output and sitemap index
        run: node scripts/verify-prerender.mjs

      - name: Deploy to Azure Static Web Apps (prebuilt)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/print-log-ui/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true
