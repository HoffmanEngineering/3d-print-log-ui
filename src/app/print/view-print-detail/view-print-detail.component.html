@if (notFound()) {
  <div class="not-found">
    <h1>Print not found</h1>
    <p>This print may have been deleted or is not public.</p>
    <a routerLink="/">Go to the home page</a>
  </div>
} @else if (print(); as p) {
  <div class="page" tabindex="-1" #pageRoot>
    <div class="content">
      <div class="hero-band">
        <app-print-detail-hero
          [printId]="p.id"
          [images]="printImages()"
          [title]="p.title"
        />

        <app-print-detail-summary
          [print]="p"
          [user]="user()"
          [isOwner]="isOwner()"
          [currencySymbol]="
            routeDataValue('preferredCurrencySymbolSetting') ?? '$'
          "
          [defaultFilamentPrice]="routeDataValue('defaultFilamentPriceSetting')"
          [kwhRate]="routeDataValue('defaultElectricityKwhRateSetting')"
          [defaultWattage]="routeDataValue('defaultElectricityWattageSetting')"
          [preferredUnit]="preferredFilamentUnit()"
          (closed)="handleClose()"
        />
      </div>

      @if (p.notes) {
        <section class="band" aria-labelledby="notes-heading">
          <h2 id="notes-heading">Notes</h2>
          <p class="notes-body">{{ p.notes }}</p>
        </section>
      }

      <div class="band-split">
        <!--
          These two sections carry aria-label rather than a band-level <h2>:
          both children render their own heading ("File Attachments",
          "Comments:"), and adding one here would duplicate it visibly.
        -->
        <section class="band" aria-label="Files">
          <app-file-attachment-section
            [printId]="p.id"
            [editable]="false"
            [isOwner]="isOwner()"
            [allowFileDownloads]="p.allowFileDownloads ?? false"
          ></app-file-attachment-section>
        </section>

        <section class="band" aria-label="Comments">
          <app-print-comments
            [printId]="p.id"
            [printOwnerUserId]="p.createdByUserId"
            [allowComments]="p.allowComments"
            [comments]="p.comments"
            (addNewComment)="addComment($event)"
          ></app-print-comments>
        </section>
      </div>

      <app-ad></app-ad>
    </div>

    <aside class="ad-sidebar">
      <app-sidebar-ad></app-sidebar-ad>
    </aside>
  </div>
}
