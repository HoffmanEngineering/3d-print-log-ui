<div class="label-scanner">
  <div class="label-scanner__view">
    <div [id]="elementId" class="label-scanner__video"></div>
    @if (!unavailableReason()) {
      <div class="label-scanner__guide" aria-hidden="true"></div>
    }
    @if (reading()) {
      <p
        class="label-scanner__reading"
        role="status"
        data-testid="label-reading"
      >
        Reading the label…
      </p>
    }
  </div>
  @if (!unavailableReason()) {
    <p class="label-scanner__hint">
      Point at the barcode, or tap Read label on the printed specs
    </p>
    @if (photoError()) {
      <p class="label-scanner__error" role="alert">
        Couldn't read much from that photo. Hold the phone steady and try again.
      </p>
    }
    <button
      mat-flat-button
      color="primary"
      type="button"
      class="label-scanner__shutter"
      data-testid="label-shutter"
      [disabled]="reading() || paused()"
      (click)="readLabel()"
    >
      @if (showSpinner()) {
        <mat-spinner diameter="18" aria-label="Reading the label" />
      } @else {
        <mat-icon>photo_camera</mat-icon>
      }
      Read label
    </button>
  }
</div>
