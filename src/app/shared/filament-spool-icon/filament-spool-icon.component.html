<!--
  Front-on filament spool SVG. Concentric circles (back to front):
    - Outer flange ring (charcoal border)
    - Wound filament ring (dynamic color — the large visible area)
    - Center hub (charcoal)
    - Axle hole (dark)
-->
<svg
  viewBox="0 0 80 80"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  focusable="false"
>
  <!-- Outer flange -->
  <circle cx="40" cy="40" r="36" fill="#2d2d2d" />

  <!-- Wound filament ring — dynamic fill color -->
  <circle
    class="spool-barrel"
    [attr.fill]="fillColor()"
    cx="40"
    cy="40"
    r="30"
  />

  <!-- Center hub -->
  <circle cx="40" cy="40" r="12" fill="#2d2d2d" />

  <!-- Axle hole -->
  <circle cx="40" cy="40" r="7" fill="#111111" />
</svg>
