<section fxLayout="row wrap" fxLayoutAlign="center center">
  <mat-card fxFlex="500px" fxFlex.xs="100%">
    <form
      [formGroup]="printerForm"
      (ngSubmit)="onSubmit()"
      fxLayout="column wrap"
      fxLayoutAlign="center center"
      fxLayoutGap="10px"
    >
      <mat-card-content align="center">
        <mat-form-field>
          <mat-label>Make</mat-label>
          <input matInput type="text" formControlName="make" required />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Model</mat-label>
          <input matInput type="text" formControlName="model" required />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Description</mat-label>
          <textarea
            matInput
            type="textarea"
            formControlName="description"
          ></textarea>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Filament Diameter (mm)</mat-label>
          <input
            matInput
            type="number"
            formControlName="filamentDiameter"
            required
          />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Nozzle Diameter (mm)</mat-label>
          <input
            matInput
            type="number"
            formControlName="nozzleDiameter"
            required
          />
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions align="center">
        <button
          mat-raised-button
          type="submit"
          [disabled]="!printerForm.valid"
          color="primary"
        >
          Submit
        </button>
        <button
          mat-raised-button
          type="button"
          class="close"
          (click)="handleClose()"
          color="warn"
        >
          {{ printerForm.dirty ? 'Cancel' : 'Close' }}
        </button>
      </mat-card-actions>
      <div>
        {{ this.printerForm.getRawValue() | json }}
      </div>
    </form>
  </mat-card>
</section>
