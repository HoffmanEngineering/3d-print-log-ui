<div fxLayout="row" fxLayoutAlign="center">
  <mat-card fxFlex="500px" fxFlex.xs="100%">
    <div fxLayout="column wrap" fxLayoutAlign="start center" fxLayoutGap="10px">
      <mat-card-header fxFlex>
        <img mat-card-avatar [src]="this.user.profilePicture" />
        <mat-card-title>
          {{ print.title }}
        </mat-card-title>
        <mat-card-subtitle>
          Printed by
          <a [routerLink]="['/users', user.id]">{{ user.displayName }}</a> on
          {{ print.startDate | date: 'longDate' }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content
        fxLayout="column"
        fxLayoutAlign="start center"
        fxLayoutGap="10px"
      >
        <div fxLayout="row">
          <div class="main-image">
            <app-print-image
              fxFlex
              [printId]="print.id"
              [imageId]="selectedImage.id"
              [imageData]="selectedImage.url"
              [showDeleteOnHover]="false"
              (imageDataChange)="selectedImage.url = $event"
            ></app-print-image>
          </div>
        </div>
        <div></div>
      </mat-card-content>
