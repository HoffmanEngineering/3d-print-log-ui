@if (clickable()) {
  <button
    type="button"
    class="print-tag-chip print-tag-chip--button"
    data-cy="print-tag-chip"
    [attr.aria-label]="'Show prints tagged ' + tag().name"
    (click)="onClick($event)"
  >
    <span
      class="print-tag-dot"
      aria-hidden="true"
      [style.background-color]="tag().color"
    ></span
    >{{ tag().name }}
  </button>
} @else {
  <span class="print-tag-chip" data-cy="print-tag-chip"
    ><span
      class="print-tag-dot"
      aria-hidden="true"
      [style.background-color]="tag().color"
    ></span
    >{{ tag().name }}</span
  >
}
