name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI only builds and tests, it never writes to the repository.
permissions:
  contents: read

# A second push to the same PR makes the earlier run redundant. This suite runs
# lint, unit tests, script tests, strict typecheck and two builds, so cancelling
# saves a meaningful amount of Actions time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:brief

      - name: Test
        run: npm run test:ci

      - name: Script unit tests (sitemap, security headers)
        run: npm run test:scripts

      - name: Strict null checks (gated directories)
        run: npm run typecheck:strict

      - name: Build (dev/base config)
        run: npm run build:dev

      - name: Generate CI production environment
        run: cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts

      - name: Build (production prerender)
        run: npm run build

      - name: Verify prerendered output
        run: node scripts/verify-prerender.mjs

      - name: Verify shells
        run: node scripts/verify-shells.mjs
