@if (deactivationDate() !== null) {
  <div class="pending-deletion-banner">
    <div
      style="
        width: 70vw;
        max-width: 70vw;
        margin-left: auto;
        margin-right: auto;
      "
      class="text-area"
    >
      <div class="message">
        Your Account was deactivated on
        {{ deactivationDate() | localeDate: 'datetime' }}. All data will be
        removed 24 hours after deactivation.
      </div>
      <button
        mat-raised-button
        class="reactivate"
        color="primary"
        (click)="reactivateAccount()"
      >
        Reactivate Account
      </button>
    </div>
  </div>
}
