<mat-card appearance="outlined" class="mat-elevation-z4">
  <mat-card-header>
    @if (userProfilePictureUrl) {
      <img mat-card-avatar [src]="this.userProfilePictureUrl" />
    }
    <mat-card-title>
      <a [routerLink]="['/prints', print.id]">{{ print.title }}</a>
    </mat-card-title>
    @if (userId && userName) {
      <mat-card-subtitle>
        Printed by
        <a [routerLink]="['/users', userId]">{{ userName }}</a> on
        {{ print.startDate | date: 'longDate' }}
      </mat-card-subtitle>
    }
    @if (!userId || !userName) {
      <mat-card-subtitle>
        Printed on
        {{ print.startDate | date: 'longDate' }}
      </mat-card-subtitle>
    }
  </mat-card-header>
  <mat-card-content
    class="flex justify-start content-center items-center flex-col gap-2.5"
  >
    <div class="flex flex-row">
      <div class="main-image">
        @if (print.defaultPrintImageId > 0) {
          <app-print-image
            [printId]="print.id"
            [imageId]="print.defaultPrintImageId"
          ></app-print-image>
        }
      </div>
    </div>
    <div></div>
  </mat-card-content>
</mat-card>
