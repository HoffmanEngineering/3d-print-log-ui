name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI only builds and tests, it never writes to the repository.
permissions:
  contents: read

# A second push to the same PR makes the earlier run redundant. This suite runs
# lint, unit tests, script tests, strict typecheck and two builds, so cancelling
# saves a meaningful amount of Actions time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:brief

      # The unit tests run in Playwright's Chromium (Vitest browser mode), which npm ci
      # does not download.
      - name: Install the unit tests' browser
        run: npx playwright install --with-deps chromium

      - name: Test, with coverage
        run: npm run test:coverage

      # The totals go on the run's summary page; the HTML report, file by file and
      # line by line (templates included), is downloadable from the run.
      - name: Coverage summary
        run: node scripts/coverage-summary.mjs

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/print-log-ui/
          retention-days: 14

      - name: Script unit tests (sitemap, security headers)
        run: npm run test:scripts

      - name: Strict null checks (gated directories)
        run: npm run typecheck:strict

      - name: Typecheck Cypress specs
        run: npm run typecheck:cypress

      - name: Build (dev/base config)
        run: npm run build:dev

      - name: Generate CI production environment
        run: cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts

      - name: Build (production prerender)
        run: npm run build

      - name: Verify prerendered output
        run: node scripts/verify-prerender.mjs

      - name: Verify shells
        run: node scripts/verify-shells.mjs

  # The Cloudflare Worker that writes SEO metadata into public pages (cloudflare/seo-worker).
  # A separate package with its own lockfile, so it installs and tests on its own. The suite
  # takes well under a minute, so it runs on every change rather than behind a path filter:
  # a change to the shells it rewrites (src/shells, scripts/shell-lib.mjs) matters too.
  seo-worker:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: cloudflare/seo-worker

    steps:
      - uses: actions/checkout@v7

      # Wrangler, Miniflare and Vitest 5 need Node 22; the app's jobs stay on 20.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare/seo-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (in the Workers runtime)
        run: npm test

      # Bundles the Worker the way `wrangler deploy` would, without deploying anything.
      - name: Build (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
