<mat-toolbar color="primary">
  <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
    <div fxFlex="grow">
      <div fxLayout="column" fxLayoutAlign="center start" style="height: 56px;">
        <div fxFlex fxLayout="row" fxLayoutAlign="center center">
          <a class="link" mat-button routerLink="/" *ngIf="!auth.loggedIn"
            >Home</a
          >

          <a mat-button class="link" routerLink="/prints" *ngIf="auth.loggedIn"
            >Prints</a
          >
          <a
            mat-button
            class="link"
            routerLink="/printers"
            *ngIf="auth.loggedIn"
            >Printers</a
          >

          <ng-container *ngIf="!this.mobileQuery.matches">
            <a
              mat-button
              class="link"
              routerLink="/analytics"
              *ngIf="auth.loggedIn"
              >Analytics</a
            >

            <button mat-button class="link" [matMenuTriggerFor]="aboutMenu">
              About
            </button>
            <mat-menu #aboutMenu="matMenu">
              <!-- <button mat-menu-item>Fee</button> -->
              <a class="menu-link" mat-menu-item routerLink="/docs"
                >Documentation</a
              >
              <a
                class="menu-link"
                *ngIf="auth.loggedIn"
                mat-menu-item
                routerLink="/feedback"
                >Send Feedback</a
              >
            </mat-menu>
          </ng-container>
        </div>
        <div
          fxFlex
          fxLayout="row"
          fxLayoutAlign="center center"
          *ngIf="this.mobileQuery.matches"
        >
          <ng-container>
            <a
              mat-button
              class="link"
              routerLink="/analytics"
              *ngIf="auth.loggedIn"
              >Analytics</a
            >

            <button mat-button class="link" [matMenuTriggerFor]="aboutMenu">
              About
            </button>
            <mat-menu #aboutMenu="matMenu">
              <!-- <button mat-menu-item>Fee</button> -->
              <a class="menu-link" mat-menu-item routerLink="/docs"
                >Documentation</a
              >
              <a
                class="menu-link"
                *ngIf="auth.loggedIn"
                mat-menu-item
                routerLink="/feedback"
                >Send Feedback</a
              >
            </mat-menu>
          </ng-container>
        </div>
      </div>
    </div>
    <div fxFlex>
      <button
        class="transparent"
        [matMenuTriggerFor]="profileMenu"
        *ngIf="auth.loggedIn"
      >
        <img
          class="profile-picture"
          *ngIf="profilePictureUrl"
          [src]="profilePictureUrl"
          alt="User's Profile Picture"
        />

        <img
          class="profile-picture"
          *ngIf="!profilePictureUrl"
          src="/assets/user.svg"
          alt="Default Profile Picture"
        />
      </button>
      <mat-menu #profileMenu="matMenu">
        <a
          class="menu-link"
          mat-menu-item
          [routerLink]="['users', userId]"
          *ngIf="auth.loggedIn && isUserProfileFeatureEnabled"
          >My Profile</a
        >
        <button mat-menu-item (click)="auth.logout()" *ngIf="auth.loggedIn">
          Log Out
        </button>
      </mat-menu>

      <button
        mat-raised-button
        color="accent"
        (click)="auth.login('/prints')"
        *ngIf="!auth.loggedIn"
      >
        Log In/Create Account
      </button>
    </div>
  </mat-toolbar-row>
</mat-toolbar>

<ng-template #links> </ng-template>
