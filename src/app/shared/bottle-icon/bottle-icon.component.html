<svg
  viewBox="0 0 80 80"
  width="100%"
  height="100%"

  aria-hidden="true"
  focusable="false"
>

  <!-- Bottle silhouette — wide neck (resin/powder style), gentle shoulder to cylindrical body -->

    class="bottle-body"
    [attr.fill]="fillColor()"
    stroke="#2d2d2d"
    stroke-width="2.5"
    stroke-linejoin="round"
    d="M 22 10 L 58 10 L 58 18
       Q 64 22 64 28 L 64 66
       Q 64 74 56 74 L 24 74
       Q 16 74 16 66 L 16 28
       Q 16 22 22 18 Z"
  />
</svg>
