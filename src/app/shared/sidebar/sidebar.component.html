<mat-nav-list class="sidebar">
  @for (item of navItems; track item) {
    @if (item.divider) {
      <div class="divider">
        <mat-divider></mat-divider>
      </div>
    }
    @if (item.url) {
      <a
        mat-list-item
        [routerLink]="[item.url]"
        routerLinkActive="active-link"
        >{{ item.name }}</a
      >
    }
  }
</mat-nav-list>
