<div fxLayout="row wrap" fxLayoutAlign="center center">
  <mat-card fxFlex="1000px" fxFlex.xs="100%">
    <section>
      <h1>Welcome to 3D Print Log</h1>
      <p>
        3D Print Log is a simple tool for tracking 3D prints. Easily keep track
        of print status, print duration, filament usage and more.
      </p>
      <p>
        <a [routerLink]="['/docs', 'getting-started']"
          >View the quick start guide</a
        >
        , or jump to it and
        <a
          href
          (click)="auth.login('/prints')"
          aria-label="Login or Create Free Account"
          >create a <strong>free</strong> account</a
        >
        today and start logging!
      </p>
    </section>
  </mat-card>
</div>
