<aside class="doc-feedback" aria-labelledby="doc-feedback-heading">
  @if (phase() === 'asking') {
    <p id="doc-feedback-heading" class="doc-feedback__prompt">
      Was this page helpful?
    </p>
    <div class="doc-feedback__actions">
      <button
        mat-stroked-button
        type="button"
        data-cy="doc-feedback-yes"
        (click)="voteHelpful()"
      >
        <mat-icon>thumb_up</mat-icon>
        Yes
      </button>
      <button
        mat-stroked-button
        type="button"
        data-cy="doc-feedback-no"
        (click)="voteUnhelpful()"
      >
        <mat-icon>thumb_down</mat-icon>
        No
      </button>
    </div>
  } @else if (phase() === 'explaining') {
    <label
      id="doc-feedback-heading"
      class="doc-feedback__prompt"
      for="doc-feedback-text"
    >
      Sorry about that — what were you looking for?
    </label>
    <textarea
      id="doc-feedback-text"
      class="doc-feedback__input"
      rows="3"
      maxlength="1000"
      data-cy="doc-feedback-comment"
      [value]="comment()"
      (input)="onCommentInput($event)"
    ></textarea>
    <div class="doc-feedback__actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        data-cy="doc-feedback-submit"
        (click)="submit()"
      >
        Send
      </button>
      <button
        mat-button
        type="button"
        data-cy="doc-feedback-skip"
        (click)="skip()"
      >
        No thanks
      </button>
    </div>
  } @else {
    <p
      id="doc-feedback-heading"
      class="doc-feedback__prompt"
      data-cy="doc-feedback-thanks"
      role="status"
    >
      Thanks — this helps us decide what to improve.
    </p>
  }
</aside>
