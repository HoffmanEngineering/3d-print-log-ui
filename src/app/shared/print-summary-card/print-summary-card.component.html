<mat-card appearance="outlined" class="mat-elevation-z4">
  <mat-card-header>
    <img
      *ngIf="userProfilePictureUrl"
      mat-card-avatar
      [src]="this.userProfilePictureUrl"
    />
    <mat-card-title>
      <a [routerLink]="['/prints', print.id]">{{ print.title }}</a>
    </mat-card-title>
    <mat-card-subtitle *ngIf="userId && userName">
      Printed by
      <a [routerLink]="['/users', userId]">{{ userName }}</a> on
      {{ print.startDate | date : 'longDate' }}
    </mat-card-subtitle>
    <mat-card-subtitle *ngIf="!userId || !userName">
      Printed on
      {{ print.startDate | date : 'longDate' }}
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content
    fxLayout="column"
    fxLayoutAlign="start center"
    fxLayoutGap="10px"
  >
    <div fxLayout="row">
      <div class="main-image">
        <app-print-image
          *ngIf="print.defaultPrintImageId > 0"
          [printId]="print.id"
          [imageId]="print.defaultPrintImageId"
        ></app-print-image>
      </div>
    </div>
    <div></div>
  </mat-card-content>
</mat-card>
