<div>
  <div class="header">
    <button
      mat-raised-button
      routerLink="new"
      type="button"
      color="accent"
      id="add-new-printer"
    >
      Add New Printer
    </button>
    <div class="search-fields">
      <mat-form-field>
        <mat-label> Search: </mat-label
        ><input
          id="printer-list-search-input"
          matInput
          type="text"
          [(ngModel)]="searchText"
          (ngModelChange)="debouncedUpdateFilter()"
          autocomplete="off"
      /></mat-form-field>

      <mat-checkbox
        type="checkbox"
        [(ngModel)]="includeInactive"
        (ngModelChange)="updateFilter()"
        >Include Inactive</mat-checkbox
      >
    </div>
  </div>

  <table mat-table [dataSource]="printers">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let printer">{{ printer.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let printer">
        {{ printer.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="make">
      <th mat-header-cell *matHeaderCellDef>Make</th>
      <td mat-cell *matCellDef="let printer">
        {{ printer.make }}
      </td>
    </ng-container>

    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef>Model</th>
      <td mat-cell *matCellDef="let printer">{{ printer.model }}</td>
    </ng-container>

    <ng-container matColumnDef="filament">
      <th mat-header-cell *matHeaderCellDef>Loaded Filament</th>
      <td mat-cell *matCellDef="let printer">
        {{ formatLoadedInFilament(printer) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let printer">
        <mat-chip-list *ngIf="!printer.isActive">
          <mat-chip color="accent" selected>Inactive</mat-chip>
        </mat-chip-list>
      </td>
    </ng-container>

    <ng-container matColumnDef="more">
      <th mat-header-cell *matHeaderCellDef></th>
      <td
        mat-cell
        *matCellDef="let printer"
        (click)="$event.preventDefault(); $event.stopPropagation()"
      >
        <button
          mat-button
          class="transparent"
          [matMenuTriggerFor]="aboutMenu"
          data-cy-more-button
        >
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #aboutMenu="matMenu">
          <a
            class="menu-link"
            mat-menu-item
            [routerLink]="[printer.id]"
            data-cy-edit-menu-option
            ><mat-icon>edit</mat-icon>Edit</a
          >

          <button
            type="button"
            mat-menu-item
            (click)="unloadAllFilament(printer)"
            [disabled]="
              printer.loadedFilaments?.length === null ||
              printer.loadedFilaments?.length === 0
            "
            [attr.aria-label]="'Unload filament from printer ' + printer.name"
          >
            <mat-icon>remove_circle</mat-icon>Unload Filament
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [routerLink]="row.id"
      data-cy-printer-row
    ></tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="pageChange($event)"
  >
  </mat-paginator>

  <app-ad></app-ad>
</div>
