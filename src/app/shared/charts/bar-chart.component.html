<div class="bar-chart-shell" (mouseleave)="hideTooltip()">
  <svg
    class="bar-chart"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    [attr.data-orientation]="resolvedOrientation()"
    preserveAspectRatio="none"
  >
    <!-- Swatch gradients must live inside THIS svg: a url(#id) fill cannot resolve across
         document fragments in some engines, and scoping them here keeps ids local. -->
    <ng-content select="[appFilamentSvgDefs]" />

    @if (signedSeries().length > 0) {
      <!-- Signed (unstacked) series are hatched so a correction never reads as one more
           stacked series. Colors come from classes, so a theme switch needs no re-render. -->
      <defs>
        <pattern
          [attr.id]="hatchId"
          patternUnits="userSpaceOnUse"
          width="6"
          height="6"
          patternTransform="rotate(45)"
        >
          <rect class="bar-chart__hatch-bg" width="6" height="6" />
          <line class="bar-chart__hatch-line" x1="0" y1="0" x2="0" y2="6" />
        </pattern>
      </defs>
    }

    @for (tick of valueTicks(); track tick.value) {
      <line
        class="bar-chart__grid-line"
        aria-hidden="true"
        [attr.x1]="tick.x1"
        [attr.x2]="tick.x2"
        [attr.y1]="tick.y"
        [attr.y2]="tick.y"
      />
      <text
        class="bar-chart__value-label"
        aria-hidden="true"
        [attr.x]="tick.x1 - 6"
        [attr.y]="tick.y + 4"
        text-anchor="end"
      >
        {{ tick.value }}
      </text>
    }
    <!-- Axis text is decorative: the same values are announced on each segment's label and in
       the frame's data table, so repeating them here would just be noise. -->
    @for (label of axisLabels(); track label.key) {
      <text
        class="bar-chart__axis-label"
        aria-hidden="true"
        [attr.x]="label.x"
        [attr.y]="label.y"
        [attr.text-anchor]="label.anchor"
      >
        {{ label.text }}
      </text>
    }

    @for (bucket of bucketHitboxes(); track bucket.datum.fullLabel) {
      <rect
        class="bar-chart__bucket-hitbox"
        aria-hidden="true"
        [attr.x]="bucket.x"
        [attr.y]="bucket.y"
        [attr.width]="bucket.w"
        [attr.height]="bucket.h"
        (mouseenter)="showBucketTooltip(bucket)"
      />
    }

    @if (zeroLine(); as zero) {
      <line
        class="bar-chart__zero-line"
        aria-hidden="true"
        [attr.x1]="zero.x1"
        [attr.x2]="zero.x2"
        [attr.y1]="zero.y"
        [attr.y2]="zero.y"
      />
    }

    @if (tooltip(); as tip) {
      <line
        class="bar-chart__crosshair"
        aria-hidden="true"
        [attr.x1]="tip.crosshairX"
        [attr.x2]="tip.crosshairX"
        [attr.y1]="8"
        [attr.y2]="height() - 28"
      />
    }

    @for (segment of segments(); track segment.tooltip) {
      <rect
        [class]="
          segment.signed
            ? 'bar-chart__segment bar-chart__segment--signed'
            : segment.fill
              ? 'bar-chart__segment bar-chart__segment--swatch'
              : 'bar-chart__segment chart-fill-' + segment.seriesIndex
        "
        [attr.fill]="segment.fill"
        [attr.filter]="segment.filter"
        [attr.fill-opacity]="segment.fillOpacity"
        [attr.x]="segment.x"
        [attr.y]="segment.y"
        [attr.width]="segment.w"
        [attr.height]="segment.h"
        tabindex="0"
        role="button"
        [attr.aria-label]="segment.tooltip"
        (mouseenter)="showSegmentTooltip(segment)"
        (focus)="showSegmentTooltip(segment)"
        (blur)="hideTooltip()"
        (click)="onSelect(segment)"
        (keydown.enter)="onSelect(segment)"
      >
        <title>{{ segment.tooltip }}</title>
      </rect>
      @if (segment.breakPath) {
        <path
          class="bar-chart__break"
          aria-hidden="true"
          [attr.d]="segment.breakPath"
        />
      }
    }
  </svg>

  @if (tooltip(); as tip) {
    <div
      class="bar-chart__tooltip"
      data-testid="bar-tooltip"
      role="status"
      [style.left.px]="tip.x"
      [style.top.px]="tip.y"
    >
      <strong>{{ tip.title }}</strong>
      @for (line of tip.lines; track line.key) {
        <span>
          <i
            [class]="
              line.signed
                ? 'bar-chart__key--signed'
                : line.swatch
                  ? 'bar-chart__key--swatch'
                  : 'chart-bg-' + line.seriesIndex
            "
          ></i>
          {{ line.label }}: {{ line.value }}
        </span>
      }
    </div>
  }
</div>
