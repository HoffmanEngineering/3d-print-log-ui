<div class="stats-grid">
  <app-stat-panel
    [title]="'Total Prints'"
    [value]="printCountTotal()"
    [invertDisplay]="true"
  ></app-stat-panel>
  <app-stat-panel
    [title]="'Total Print Time'"
    [value]="totalPrintTimeTotal()"
    [invertDisplay]="true"
  ></app-stat-panel>
  <app-stat-panel
    [title]="'Total Filament Usage'"
    [value]="totalFilamentUsageInG()"
    [invertDisplay]="true"
  ></app-stat-panel>

  <app-stat-panel
    [title]="'Total Prints\n(last 30 Days)'"
    [value]="printCountLast30Days()"
    [invertDisplay]="true"
  ></app-stat-panel>
  <app-stat-panel
    [title]="'Print Time\n(last 30 Days)'"
    [value]="totalPrintTimeLast30Days()"
    [invertDisplay]="true"
  ></app-stat-panel>
  <app-stat-panel
    [title]="'Filament Usage\n(last 30 Days)'"
    [value]="totalFilamentUsageLast30DaysInG()"
    [invertDisplay]="true"
  ></app-stat-panel>
</div>
