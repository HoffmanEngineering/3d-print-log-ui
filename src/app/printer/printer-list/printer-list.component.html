<div>
  <div routerLink="new">
    <button mat-raised-button type="button" color="accent">
      Add New Printer
    </button>
  </div>

  <mat-form-field>
    <mat-label>
      Search: </mat-label
    ><input
      matInput
      type="text"
      [(ngModel)]="searchText"
      (ngModelChange)="updateFilter()"
  /></mat-form-field>

  <mat-checkbox
    type="checkbox"
    [(ngModel)]="includeInactive"
    (ngModelChange)="updateFilter()"
    >Include Inactive</mat-checkbox
  >

  <table mat-table [dataSource]="printers">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let printer">{{ printer.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let printer">
        {{ printer.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="make">
      <th mat-header-cell *matHeaderCellDef>Make</th>
      <td mat-cell *matCellDef="let printer">
        {{ printer.make }}
      </td>
    </ng-container>

    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef>Model</th>
      <td mat-cell *matCellDef="let printer">{{ printer.model }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Is Active</th>
      <td mat-cell *matCellDef="let printer">{{ printer.isActive }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [routerLink]="row.id"
    ></tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="pageChange($event)"
  >
  </mat-paginator>
</div>
