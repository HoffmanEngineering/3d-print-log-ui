<section fxLayout="row wrap" fxLayoutAlign="center center">
  <mat-card fxFlex="500px" fxFlex.xs="100%">
    <h1>Send Feedback</h1>
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      fxLayout="column wrap"
      fxLayoutAlign="center center"
      fxLayoutGap="10px"
    >
      <mat-card-content align="center">
        <mat-form-field>
          <mat-label> Type</mat-label>
          <mat-select formControlName="type" required>
            <mat-option [value]="feedbackTypes.Suggestion"
              >Suggestion</mat-option
            >
            <mat-option [value]="feedbackTypes.Question">Question</mat-option>
            <mat-option [value]="feedbackTypes.Bug">Bug</mat-option>
            <mat-option [value]="feedbackTypes.Other">Other</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Feedback</mat-label>
          <textarea
            matInput
            type="text"
            formControlName="note"
            required
            rows="4"
            maxlength="5000"
          ></textarea>
          <mat-error *ngIf="form.controls['note'].hasError('required')">
            A Note is <strong>required</strong>
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email (optional)</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            rows="4"
            maxlength="1000"
          />
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions align="center">
        <button
          mat-raised-button
          type="submit"
          [disabled]="!form.valid"
          color="primary"
        >
          Submit
        </button>
        <button
          mat-raised-button
          type="button"
          class="close"
          (click)="handleClose()"
          color="warn"
        >
          {{ form.dirty ? 'Cancel' : 'Close' }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</section>
