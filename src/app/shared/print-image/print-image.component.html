<div
  class="wrapper"
  (mouseenter)="imageHovered = true"
  (mouseleave)="imageHovered = false"
  (click)="imageHovered = !imageHovered"
>
  @if (showDeleteOnHover && imageHovered) {
    <button
      mat-raised-button
      aria-hidden="false"
      aria-label="Remove Image"
      title="Remove Image"
      class="overlay pointable"
      color="warn"
      (click)="handleDeleteClick($event)"
    >
      <mat-icon>delete</mat-icon>Remove
    </button>
  }
  @if (imageData && !imageFailed) {
    <img
      [src]="imageData"
      class="fade-in"
      [alt]="alt || 'Image of 3D print'"
      (error)="onImageError()"
    />
  } @else if (imageFailed) {
    <div class="image-failed">
      <mat-icon aria-hidden="true">broken_image</mat-icon>
      <span>Image unavailable</span>
    </div>
  }
</div>
