<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — 3D Print Log</title>
    <meta
      name="description"
      content="This page does not exist on 3D Print Log."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#3F50B5" />
    <link rel="icon" type="image/x-icon" href="/favicon_1293b2036.ico" />
    <!-- Served by Azure Static Web Apps (responseOverrides.404) for every path
         that is neither a file nor an SPA route, with the 404 status kept. It is
         static on purpose: an agent probing for /.well-known/* or /openapi.json
         must get a clean "absent", not the app shell. Keep it self-contained. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark-theme');
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --text: #212121;
        --muted: #5f6368;
        --brand: #3f51b5;
        --link: #3f51b5;
        --border: #e0e0e0;
      }
      html.dark-theme {
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #e8eaed;
        --muted: #a0a4a8;
        --brand: #283593;
        --link: #9fa8da;
        --border: #333333;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Roboto,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }
      header {
        height: 64px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: var(--brand);
      }
      header a {
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: 500;
        text-decoration: none;
      }
      main {
        max-width: 560px;
        margin: 64px auto;
        padding: 32px 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .code {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 4px 0 12px;
        font-size: 1.75rem;
        font-weight: 500;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      ul {
        margin: 0;
        padding-left: 20px;
      }
      li {
        margin: 6px 0;
      }
      a {
        color: var(--link);
      }
      @media (max-width: 600px) {
        main {
          margin: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header><a href="/">3D Print Log</a></header>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>
        There is nothing at this address. It may have moved, or the link may be
        mistyped.
      </p>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/docs/getting-started">Documentation</a></li>
        <li>
          <a href="/llms.txt">llms.txt</a> (a summary of the site for AI agents)
        </li>
        <li><a href="/sitemap.xml">Sitemap</a></li>
      </ul>
    </main>
  </body>
</html>
