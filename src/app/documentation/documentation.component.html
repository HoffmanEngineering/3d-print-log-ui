<div class="example-container" [class.example-is-mobile]="mobileQuery.matches">
  <mat-toolbar color="primary" class="example-toolbar">
    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <h1 class="example-app-name">Documentation</h1>

    <span class="toolbar-spacer"></span>

    <button
      mat-icon-button
      class="docs-search-button"
      data-cy="docs-search-button"
      (click)="openSearch()"
      aria-label="Search documentation"
      [matTooltip]="searchTooltip"
    >
      <mat-icon>search</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="example-sidenav-container">
    <mat-sidenav
      #snav
      [mode]="mobileQuery.matches ? 'over' : 'side'"
      [fixedInViewport]="mobileQuery.matches"
      fixedTopGap="56"
    >
      <app-doc-sidebar
        (click)="handleSidebarClick()"
        (openSearch)="openSearch()"
      ></app-doc-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="content">
        <div class="docs-layout">
          <!-- Before the article in the DOM so it is the first thing after the
               heading on a phone, and the first thing a screen reader reaches.
               Grid placement moves it to the trailing rail on a wide screen. -->
          <app-doc-toc class="docs-layout__toc" [path]="currentPath()" />

          <div class="docs-layout__main">
            <router-outlet></router-outlet>
            <app-doc-related [path]="currentPath()" />
            <app-doc-page-nav [path]="currentPath()" />
            <app-doc-feedback [pageKey]="currentSlug()"></app-doc-feedback>
            <app-ad></app-ad>
          </div>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
