<div class="dialog-header">
  <h2 mat-dialog-title>Select Filament</h2>
  <button
    mat-icon-button
    (click)="toggleViewMode()"
    [matTooltip]="viewMode() === 'list' ? 'Scan QR Code' : 'Show List'"
    class="scan-toggle-button"
  >
    <mat-icon>{{
      viewMode() === 'list' ? 'qr_code_scanner' : 'list'
    }}</mat-icon>
  </button>
</div>

<mat-dialog-content class="picker-content">
  <!--
    The list stays mounted through lookups and the QR scanner, so its search text, page and
    the selection it shows survive both.
  -->
  <app-filament-list
    [hidden]="viewMode() !== 'list'"
    (filamentSelected)="handleFilamentSelected($event)"
    (selectionToggled)="toggleFilament($event)"
    [selectedIds]="selectedIds()"
    [filterByMaterialCategory]="data.filterByMaterialCategory"
    [multiSelect]="data.multiSelect"
  ></app-filament-list>
  @if (viewMode() === 'scanner') {
    @if (scanError()) {
      <div class="scan-error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ scanError() }}</span>
        <button mat-button color="primary" (click)="retryScan()">
          Try Again
        </button>
      </div>
    }
    @if (!scanError()) {
      <app-qr-scanner (scanned)="handleQrScanned($event)"></app-qr-scanner>
    }
  }
  @if (loading()) {
    <div class="loading-overlay" role="status">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Looking up filament...</p>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (!data.multiSelect) {
    <div
      matTooltip="Only one 'Other' filament record allowed per print."
      [matTooltipDisabled]="this.data.otherFilamentOption !== null"
      style="margin-right: 5px"
    >
      <button
        mat-raised-button
        [disabled]="this.data.otherFilamentOption === null"
        (click)="selectOtherFilament()"
        color="basic"
      >
        Use Non-Tracked "Other" Filament
      </button>
    </div>
  }
  @if (data.multiSelect) {
    <button
      mat-raised-button
      color="accent"
      [disabled]="selectedFilaments().length === 0"
      (click)="confirmSelection()"
    >
      Add {{ selectedFilaments().length }}
      {{ selectedFilaments().length === 1 ? 'Filament' : 'Filaments' }}
    </button>
  }
  <button mat-button (click)="closeSelected()" cdkFocusInitial color="basic">
    Close
  </button>
</mat-dialog-actions>
