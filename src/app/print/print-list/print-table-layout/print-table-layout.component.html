<h1 mat-dialog-title>Print Table Layout</h1>
<div mat-dialog-content>
  <mat-selection-list
    [(ngModel)]="selectedColumns"
    (ngModelChange)="this.data.changeEvent.next($event)"
  >
    <mat-list-option
      *ngFor="let column of allColumns"
      [value]="column.key"
      [matTooltip]="column.description"
    >
      {{ column.displayName }}
    </mat-list-option>
  </mat-selection-list>
</div>
<div
  mat-dialog-actions
  fxLayout="row"
  fxLayoutAlign="space-between center"
  fxLayout
>
  <button
    type="button"
    mat-raised-button
    color="basic"
    (click)="resetToDefaults()"
  >
    Reset to Default
  </button>
  <button
    type="button"
    mat-raised-button
    color="primary"
    [mat-dialog-close]="selectedColumns"
  >
    Save
  </button>
  <button
    type="button"
    mat-raised-button
    color="accent"
    (click)="resetSelection()"
  >
    Close
  </button>
</div>
