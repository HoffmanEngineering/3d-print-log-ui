<div>
  <div routerLink="new">
    <button mat-raised-button type="button" color="accent">
      Add New Print
    </button>
  </div>

  <table mat-table [dataSource]="prints">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let print">{{ print.title }}</td>
    </ng-container>

    <ng-container matColumnDef="printer">
      <th mat-header-cell *matHeaderCellDef>Printer</th>
      <td mat-cell *matCellDef="let print">
        {{ print.printer.make }} {{ print.printer.model }}
      </td>
    </ng-container>

    <ng-container matColumnDef="start-date">
      <th mat-header-cell *matHeaderCellDef>Start Date</th>
      <td mat-cell *matCellDef="let print">{{ print.startDate | date }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let print">{{ getStatus(print) }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [routerLink]="row.id"
    ></tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="pageChange($event)"
  >
  </mat-paginator>
</div>
