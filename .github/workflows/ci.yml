name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:brief

      - name: Test
        run: npm run test:ci

      - name: Sitemap unit tests
        run: npm run test:sitemap

      - name: Build (dev/base config)
        run: npm run build:dev

      - name: Generate CI production environment
        run: cp src/environments/environment.prod.example.ts src/environments/environment.prod.ts

      - name: Build (production prerender)
        run: npm run build

      - name: Verify prerendered output
        run: node scripts/verify-prerender.mjs

      - name: Verify shells
        run: node scripts/verify-shells.mjs
