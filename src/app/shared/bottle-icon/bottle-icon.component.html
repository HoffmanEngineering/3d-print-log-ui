<svg
  [style.filter]="
    finishType() === FilamentFinishType.Matte
      ? 'saturate(0.82) brightness(0.94)'
      : null
  "
  viewBox="0 0 80 80"
  width="100%"
  height="100%"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  focusable="false"
  overflow="visible"
>
  <defs>
    <!-- Vertical gradient (top-to-bottom) for Gradient / Rainbow -->
    @if (useGradient()) {
      <linearGradient [id]="gradientId()" x1="50%" y1="0%" x2="50%" y2="100%">
        @for (stop of gradientStops(); track $index) {
          <stop [attr.offset]="stop.offset" [attr.stop-color]="stop.color" />
        }
      </linearGradient>
    }

    <!-- ClipPaths for Multi -->
    @for (seg of clipSegments(); track seg.id) {
      <clipPath [id]="seg.id">
        <rect [attr.x]="seg.x" y="0" [attr.width]="seg.width" height="80" />
      </clipPath>
    }

    <!-- Silk sheen -->
    @if (finishType() === FilamentFinishType.Silk) {
      <linearGradient [id]="uid + '-silk'" x1="15%" y1="10%" x2="55%" y2="60%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
        <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
    }

    <!-- GITD glow -->
    @if (hasEffect(FilamentEffect.GlowInDark)) {
      <filter [id]="uid + '-glow'" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    }

    <!-- Fluorescent UV -->
    @if (hasEffect(FilamentEffect.Fluorescent)) {
      <filter [id]="uid + '-uv'" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feColorMatrix
          in="blur"
          type="matrix"
          values="0.3 0 0.8 0 0  0 0 0.5 0 0  1.2 0 0.8 0 0  0 0 0 1 0"
          result="uv-color"
        />
        <feMerge>
          <feMergeNode in="uv-color" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    }

    <!-- Sparkle glow -->
    @if (hasEffect(FilamentEffect.Sparkle)) {
      <filter [id]="uid + '-sp'" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="1.5" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    }

    <!-- Carbon fiber -->
    @if (hasEffect(FilamentEffect.CarbonFiber)) {
      <pattern
        [id]="uid + '-cf'"
        x="0"
        y="0"
        width="6"
        height="6"
        patternUnits="userSpaceOnUse"
      >
        <rect width="6" height="6" fill="#1a1a1a" />
        <rect x="0" y="0" width="3" height="3" fill="#2e2e2e" />
        <rect x="3" y="3" width="3" height="3" fill="#2e2e2e" />
      </pattern>
    }

    <!-- Glass fiber -->
    @if (hasEffect(FilamentEffect.GlassFiber)) {
      <pattern
        [id]="uid + '-gf'"
        x="0"
        y="0"
        width="5"
        height="5"
        patternUnits="userSpaceOnUse"
      >
        <rect width="5" height="5" fill="#c8d8e8" />
        <line
          x1="0"
          y1="0"
          x2="5"
          y2="5"
          stroke="#e8f0f8"
          stroke-width="1"
          opacity="0.7"
        />
        <line
          x1="5"
          y1="0"
          x2="0"
          y2="5"
          stroke="#a8b8c8"
          stroke-width="0.5"
          opacity="0.4"
        />
      </pattern>
    }

    <!-- Wood grain -->
    @if (hasEffect(FilamentEffect.WoodFill)) {
      <linearGradient [id]="uid + '-wood'" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8b4513" stop-opacity="0.5" />
        <stop offset="40%" stop-color="#cd853f" stop-opacity="0.3" />
        <stop offset="70%" stop-color="#8b4513" stop-opacity="0.5" />
        <stop offset="100%" stop-color="#6b3310" stop-opacity="0.4" />
      </linearGradient>
    }

    <!-- Metal fill -->
    @if (hasEffect(FilamentEffect.MetalFill)) {
      <linearGradient [id]="uid + '-metal'" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e8a044" stop-opacity="0.55" />
        <stop offset="40%" stop-color="#7b4000" stop-opacity="0.4" />
        <stop offset="75%" stop-color="#cd7f32" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#e8a044" stop-opacity="0.3" />
      </linearGradient>
    }
  </defs>

  <!-- Cap -->
  <rect x="18" y="2" width="44" height="14" rx="2" fill="#2d2d2d" />

  <!-- Bottle outline — drawn before glow group so bloom paints over it (dark stroke would cancel glow if inside group) -->
  <path
    fill="none"
    stroke="#2d2d2d"
    stroke-width="2.5"
    stroke-linejoin="round"
    [attr.d]="BOTTLE_BODY"
  />

  <!-- Glow / UV filter wraps fill + overlays so all edges bloom consistently -->
  <g
    [attr.filter]="
      hasEffect(FilamentEffect.GlowInDark)
        ? 'url(#' + uid + '-glow)'
        : hasEffect(FilamentEffect.Fluorescent)
          ? 'url(#' + uid + '-uv)'
          : null
    "
  >
    <!-- Bottle body — Solid (fill only; stroke handled by outline above) -->
    @if (colorPattern() === ColorPatternType.Solid) {
      <path
        class="bottle-body"
        [attr.fill]="fillColor()"
        [attr.fill-opacity]="fillOpacity()"
        [attr.d]="BOTTLE_BODY"
      />
    }

    <!-- Bottle body — Multi -->
    @for (seg of clipSegments(); track seg.id) {
      <path
        [attr.fill]="seg.color"
        [attr.fill-opacity]="fillOpacity()"
        [attr.clip-path]="'url(#' + seg.id + ')'"
        [attr.d]="BOTTLE_BODY"
      />
    }

    <!-- Bottle body — Gradient / Rainbow (fill only; stroke handled by outline above) -->
    @if (useGradient()) {
      <path
        class="bottle-body"
        [attr.fill]="'url(#' + gradientId() + ')'"
        [attr.fill-opacity]="fillOpacity()"
        [attr.d]="BOTTLE_BODY"
      />
    }

    <!-- Effect overlays -->
    @if (finishType() === FilamentFinishType.Silk) {
      <path [attr.fill]="'url(#' + uid + '-silk)'" [attr.d]="BOTTLE_BODY" />
    }
    @if (hasEffect(FilamentEffect.CarbonFiber)) {
      <path
        [attr.fill]="'url(#' + uid + '-cf)'"
        fill-opacity="0.85"
        [attr.d]="BOTTLE_BODY"
      />
    }
    @if (hasEffect(FilamentEffect.GlassFiber)) {
      <path
        [attr.fill]="'url(#' + uid + '-gf)'"
        fill-opacity="0.65"
        [attr.d]="BOTTLE_BODY"
      />
    }
    @if (hasEffect(FilamentEffect.WoodFill)) {
      <path [attr.fill]="'url(#' + uid + '-wood)'" [attr.d]="BOTTLE_BODY" />
    }
    @if (hasEffect(FilamentEffect.MetalFill)) {
      <path [attr.fill]="'url(#' + uid + '-metal)'" [attr.d]="BOTTLE_BODY" />
    }
  </g>

  <!-- Sparkle stars (4-point, 8 vertices: outer points on axes, inner at 45°) -->
  @if (hasEffect(FilamentEffect.Sparkle)) {
    <path
      class="sparkle-dot"
      d="M30,32.5 L30.71,34.29 L32.5,35 L30.71,35.71 L30,37.5 L29.29,35.71 L27.5,35 L29.29,34.29 Z"
      fill="#ffe97a"
      [attr.filter]="'url(#' + uid + '-sp)'"
    />
    <path
      class="sparkle-dot sparkle-dot--2"
      d="M55,47.7 L55.64,49.36 L57.3,50 L55.64,50.64 L55,52.3 L54.36,50.64 L52.7,50 L54.36,49.36 Z"
      fill="#fff5a0"
      [attr.filter]="'url(#' + uid + '-sp)'"
    />
    <path
      class="sparkle-dot sparkle-dot--3"
      d="M28,58 L28.57,59.43 L30,60 L28.57,60.57 L28,62 L27.43,60.57 L26,60 L27.43,59.43 Z"
      fill="#ffe97a"
      [attr.filter]="'url(#' + uid + '-sp)'"
    />
    <path
      class="sparkle-dot sparkle-dot--4"
      d="M52,26.1 L52.53,27.47 L53.9,28 L52.53,28.53 L52,29.9 L51.47,28.53 L50.1,28 L51.47,27.47 Z"
      fill="#ffe97a"
      [attr.filter]="'url(#' + uid + '-sp)'"
    />
  }
</svg>
