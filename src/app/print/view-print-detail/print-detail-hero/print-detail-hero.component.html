@if (hasImages()) {
  <app-image-carousel
    [imageCount]="images().length"
    [selectedIndex]="selectedIndex()"
    (indexChange)="onIndexChange($event)"
  >
    <!-- One-item @for, tracked by id: a new selection gets a new app-print-image, which
         fetches on init. Without a direct URL (a private print) imageData must be null,
         not undefined, for it to fetch with the owner's token. -->
    @for (image of selectedImages(); track image.id) {
      <div class="main-image">
        <app-print-image
          [printId]="printId()"
          [imageId]="image.id"
          [imageData]="image.url ?? null"
          [alt]="selectedAlt()"
          [showDeleteOnHover]="false"
        ></app-print-image>
      </div>
    }
  </app-image-carousel>
  @if (showThumbnails()) {
    <app-image-thumbnail-strip
      [images]="images()"
      [selectedId]="$safeNavigationMigration(selectedImage()?.id)"
      (imageSelected)="onImageSelected($event)"
    />
  }
} @else {
  <div class="no-image">
    <span>No images for this print</span>
  </div>
}
