<section fxLayout="row wrap" fxLayoutAlign="center center">
  <mat-card fxFlex="500px" fxFlex.xs="100%">
    <form
      [formGroup]="printForm"
      (ngSubmit)="onSubmit()"
      fxLayout="column wrap"
      fxLayoutAlign="center center"
      fxLayoutGap="10px"
      autocomplete="off"
    >
      <input
        type="file"
        class="custom-file-input form-control"
        id="files"
        (change)="detectFiles($event)"
      />
      <img
        *ngIf="selectedImage && selectedImage.value"
        mat-card-image
        [src]="this.selectedImage.value.url"
        class="card-img-top"
        alt="Image Preview"
      />

      <div class="images-preview mt-2" *ngIf="images.length">
        <div
          formArrayName="images"
          *ngFor="let image of images.controls; let i = index"
        >
          <div
            [formGroupName]="i"
            [ngClass]="{
              isDefault: image?.value?.isDefault === true
            }"
          >
            <img
              [src]="$any(image).value.url"
              class="image-preview"
              [ngClass]="{
                isSelected: selectedImage === image
              }"
              alt="Image Preview"
              (click)="selectImage(image)"
            />
          </div>
        </div>
      </div>

      <mat-card-content align="center">
        <mat-form-field>
          <mat-label> Title</mat-label>
          <input matInput type="text" formControlName="title" required />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Notes</mat-label>
          <input matInput type="text" formControlName="notes" />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Start Date</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            placeholder="Choose a date"
            formControlName="startDate"
            required
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field>
          <mat-label> Thing URL</mat-label>
          <input matInput type="url" formControlName="url" />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Estimated Print Time</mat-label>
          <input
            matInput
            type="text"
            formControlName="estimatedPrintTimeInSeconds"
          />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Estimated Filament Usage</mat-label>
          <input
            matInput
            type="text"
            formControlName="estimatedFilamentUsageMg"
          />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Actual Print Time</mat-label>
          <input matInput type="text" formControlName="printTimeInSeconds" />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Actual Filament Usage</mat-label>
          <input matInput type="text" formControlName="filamentUsageMg" />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Filament Type</mat-label>
          <input matInput type="text" formControlName="filamentType" />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Printer</mat-label>
          <mat-select formControlName="printerId">
            <mat-option *ngFor="let printer of printers" [value]="printer.id">{{
              getPrinterLabel(printer)
            }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field>
          <mat-label> Status</mat-label>
          <mat-select formControlName="status">
            <mat-option [value]="printStatusTypes.Pending">Pending</mat-option>
            <mat-option [value]="printStatusTypes.Printing"
              >Printing</mat-option
            >
            <mat-option [value]="printStatusTypes.Success">Success</mat-option>
            <mat-option [value]="printStatusTypes.Cancelled"
              >Cancelled</mat-option
            >
            <mat-option [value]="printStatusTypes.Failed">Failed</mat-option>
          </mat-select>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions align="center">
        <button
          mat-raised-button
          type="submit"
          [disabled]="!printForm.valid"
          color="primary"
        >
          Submit
        </button>
        <button
          mat-raised-button
          type="button"
          class="close"
          (click)="handleClose()"
          color="warn"
        >
          {{ printForm.dirty ? 'Cancel' : 'Close' }}
        </button>
      </mat-card-actions>
      <div style="width: 100%;">
        {{ this.printForm.getRawValue() | json }}
      </div>
    </form>
  </mat-card>
</section>
