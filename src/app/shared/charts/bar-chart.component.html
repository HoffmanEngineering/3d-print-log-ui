<svg
  class="bar-chart"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [attr.data-orientation]="resolvedOrientation()"
  preserveAspectRatio="none"
>
  <!-- Axis text is decorative: the same values are announced on each segment's label and in
       the frame's data table, so repeating them here would just be noise. -->
  @for (label of axisLabels(); track label.text) {
    <text
      class="bar-chart__axis-label"
      aria-hidden="true"
      [attr.x]="label.x"
      [attr.y]="label.y"
      [attr.text-anchor]="label.anchor"
    >
      {{ label.text }}
    </text>
  }

  @for (segment of segments(); track segment.label + segment.seriesKey) {
    <rect
      [class]="'bar-chart__segment chart-fill-' + segment.seriesIndex"
      [attr.x]="segment.x"
      [attr.y]="segment.y"
      [attr.width]="segment.w"
      [attr.height]="segment.h"
      tabindex="0"
      role="button"
      [attr.aria-label]="segment.tooltip"
      (click)="onSelect(segment)"
      (keydown.enter)="onSelect(segment)"
    >
      <title>{{ segment.tooltip }}</title>
    </rect>
  }
</svg>
