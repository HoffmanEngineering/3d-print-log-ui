<mat-toolbar color="primary">
  <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
    <div fxFlex="50px" class="brand-img">
      <a [routerLink]="['/']" style="height: 100%; width: 100%">
        <img
          src="/assets/3d_brand_logo_b833b3f20dd.svg"
          alt="3D Print Log Logo"
        />
        <span class="visually-hidden">Navigate to home page.</span>
      </a>
      <!-- <object
        viewBox="0 0 100 100"
        type="image/svg+xml"
        data="/assets/small_logo.svg"
      >
        3D Print Log Logo
      </object> -->
    </div>
    <div fxFlex fxFlexFill>
      <div fxLayout="column" fxLayoutAlign="center start" style="height: 100%">
        <div fxFlex fxLayout="row" fxLayoutAlign="center center">
          <a
            class="link"
            mat-button
            routerLink="/"
            routerLinkActive="active"
            *ngIf="!auth.loggedIn"
            >Home</a
          >

          <a
            mat-button
            class="link"
            routerLink="/prints"
            routerLinkActive="active"
            *ngIf="auth.loggedIn"
            >Prints</a
          >
          <a
            mat-button
            class="link"
            routerLink="/printers"
            routerLinkActive="active"
            *ngIf="auth.loggedIn"
            >Printers</a
          >

          <ng-container *ngIf="!this.mobileQuery.matches">
            <a
              mat-button
              class="link"
              routerLink="/analytics"
              routerLinkActive="active"
              *ngIf="auth.loggedIn"
              >Analytics</a
            >

            <button mat-button class="link" [matMenuTriggerFor]="aboutMenu">
              About
            </button>
            <mat-menu #aboutMenu="matMenu">
              <!-- <button mat-menu-item>Fee</button> -->
              <a
                class="menu-link"
                mat-menu-item
                routerLink="/docs"
                routerLinkActive="active"
                >Documentation</a
              >
              <a
                class="menu-link"
                *ngIf="auth.loggedIn"
                mat-menu-item
                routerLink="/feedback"
                routerLinkActive="active"
                >Send Feedback</a
              >
              <a
                class="menu-link"
                mat-menu-item
                routerLink="/docs/release-notes"
                routerLinkActive="active"
                >Version v{{ versionNumber }}</a
              >
            </mat-menu>
          </ng-container>
        </div>
        <div
          fxFlex
          fxLayout="row"
          fxLayoutAlign="center center"
          *ngIf="this.mobileQuery.matches"
        >
          <ng-container>
            <a
              mat-button
              class="link"
              routerLink="/analytics"
              routerLinkActive="active"
              *ngIf="auth.loggedIn"
              >Analytics</a
            >

            <button mat-button class="link" [matMenuTriggerFor]="aboutMenu">
              About
            </button>
            <mat-menu #aboutMenu="matMenu">
              <!-- <button mat-menu-item>Fee</button> -->
              <a
                class="menu-link"
                mat-menu-item
                routerLink="/docs"
                routerLinkActive="active"
                >Documentation</a
              >
              <a
                class="menu-link"
                *ngIf="auth.loggedIn"
                mat-menu-item
                routerLink="/feedback"
                routerLinkActive="active"
                >Send Feedback</a
              >
              <a
                class="menu-link"
                mat-menu-item
                routerLink="/docs/release-notes"
                routerLinkActive="active"
                >Version v{{ versionNumber }}</a
              >
            </mat-menu>
          </ng-container>
        </div>
      </div>
    </div>
    <div [fxFlex]="auth.loggedIn ? '50px' : '200px'">
      <button
        class="transparent"
        [matMenuTriggerFor]="profileMenu"
        *ngIf="auth.loggedIn"
      >
        <img
          class="profile-picture"
          *ngIf="profilePictureUrl"
          [src]="profilePictureUrl"
          alt="User's Profile Picture"
        />

        <img
          class="profile-picture"
          *ngIf="!profilePictureUrl"
          src="/assets/user.svg"
          alt="Default Profile Picture"
        />
      </button>
      <mat-menu #profileMenu="matMenu">
        <a
          class="menu-link"
          mat-menu-item
          [routerLink]="['users', userId]"
          routerLinkActive="active"
          *ngIf="auth.loggedIn && isUserProfileFeatureEnabled"
          >My Profile</a
        >
        <a
          *ngIf="auth.loggedIn"
          class="menu-link"
          mat-menu-item
          [routerLink]="['/settings']"
          routerLinkActive="active"
          >Settings</a
        >
        <button mat-menu-item (click)="auth.logout()" *ngIf="auth.loggedIn">
          Log Out
        </button>
      </mat-menu>

      <button
        mat-raised-button
        color="accent"
        (click)="auth.login('/prints')"
        *ngIf="!auth.loggedIn"
      >
        Log In/Create Account
      </button>
    </div>
  </mat-toolbar-row>
</mat-toolbar>

<ng-template #links> </ng-template>
